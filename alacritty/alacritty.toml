
[font]
size = 15

[window]
option_as_alt = "Both"
decorations = "Full"
decorations_theme_variant = "dark"
padding = {x = 0, y = 0}
opacity = 0.8
blur = true
startup_mode = "Maximized"
dynamic_title = true


[font.normal]
family = "VictorMono Nerd Font"
style = "Bold"

[font.bold]
family = "VictorMono Nerd Font"
style = "Medium"

[font.italic]
family = "VictorMono Nerd Font"
style = "Light Italic"


[scrolling]
history = 10000
multiplier = 3

[general]
live_config_reload = true
import = ["/Users/alessandrodominici/.config/alacritty/themes/themes/tokyo-night.toml"]


[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

[terminal.shell] 
program = "/opt/homebrew/bin/fish"
